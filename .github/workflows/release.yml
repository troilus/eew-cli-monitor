name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          - os: windows-latest
            separator: ';'
            binary_suffix: ''
          - os: ubuntu-latest
            separator: ':'
            binary_suffix: '-linux'
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Extract short commit SHA
        id: vars
        run: echo "commit_short=${GITHUB_SHA::5}" >> $GITHUB_ENV
        shell: bash

      - name: Build with PyInstaller
        run: pyinstaller --onefile --add-data "sounds${{ matrix.separator }}sounds" --name "${{ env.commit_short }}-eew-cli-monitor${{ matrix.binary_suffix }}" eew-cli-monitor.py
        shell: bash

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          tag_name: ${{ github.event.inputs.tag }}
          generate_release_notes: true
